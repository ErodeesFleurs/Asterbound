name: Native cache maintenance

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read

# Serialize plans and deletion, without cancelling an in-progress cleanup.
concurrency:
  group: native-cache-maintenance
  cancel-in-progress: false

jobs:
  retain-native-snapshots:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # workflow_run is privileged: run only the default branch's reviewed script,
      # never the triggering run's checkout, artifacts, or cache contents.
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retain recent successfully saved native snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_REPOSITORY: ${{ github.repository }}
          CACHE_REF: ${{ format('refs/heads/{0}', github.event.workflow_run.head_branch) }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          python3 scripts/ci/prune-build-caches.py \
            --repository "$CACHE_REPOSITORY" --ref "$CACHE_REF" \
            --since "$RUN_STARTED_AT" --until "$RUN_UPDATED_AT" \
            --keep 2 --apply
