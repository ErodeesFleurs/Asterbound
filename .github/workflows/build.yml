name: Build
permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        description: Linux (xclang)
        default: false
      windows:
        type: boolean
        description: Windows (xclang MinGW)
        default: true
      macOS:
        type: boolean
        description: macOS (xclang)
        default: false
  push:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'version.json'
      - 'scripts/inno/**'
      - 'cmake/**'
      - 'triplets/**'
      - 'ports/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.clang-format'
      - '.gitattributes'
      - 'scripts/format-source.sh'
      - '.github/workflows/build.yml'
    branches:
      - '**'
  pull_request:
    paths:
      - 'assets/**'
      - 'source/**'
      - 'version.json'
      - 'scripts/inno/**'
      - 'cmake/**'
      - 'triplets/**'
      - 'ports/**'
      - 'scripts/ci/**'
      - '.github/actions/**'
      - '.gitattributes'
      - '.clang-format'
      - 'scripts/format-source.sh'
      - '.github/workflows/build.yml'
    branches:
      - '**'

jobs:
  checks:
    name: Fast source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check changed C++ lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 -m venv "$RUNNER_TEMP/source-quality"
          "$RUNNER_TEMP/source-quality/bin/pip" install 'clang-format==21.1.8'
          CLANG_FORMAT="$RUNNER_TEMP/source-quality/bin/clang-format" scripts/format-source.sh --check --base "$BASE_SHA"
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22
        with:
          cmakeVersion: 3.29.2
          ninjaVersion: 1.13.2
      - name: Check Lua download and project patch
        run: cmake -S scripts/ci/lua-preflight -B build/lua-preflight -G Ninja
      - name: Upload failed source preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Source-Preflight-Diagnostics
          path: build/lua-preflight/
          if-no-files-found: ignore
          retention-days: 7

  build_windows:
    name: Build Asterbound Windows x64
    needs: checks
    timeout-minutes: 120
    runs-on: windows-latest
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.windows == true)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: 'recursive'

      # Qt5's native MinGW build uses make; no MSYS2 compiler or C++ runtime is installed.
      - name: Install Qt5 make tool
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-make

      - name: Add Qt5 make to PATH
        shell: pwsh
        run: |
          "MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and build
        uses: ./.github/actions/native-build
        with:
          preset: windows-release

      - name: Run Post-Build Task
        shell: cmd
        run: scripts\ci\windows\post_build.bat

      - name: Audit Windows imports and runtime
        run: cmake -P scripts/ci/windows/audit-runtime.cmake

      - name: Smoke test client startup streams
        run: python scripts/ci/smoke-client-startup.py dist/asterbound.exe

      - name: Run Tests
        working-directory: source
        run: ctest --preset windows-release --verbose --output-junit ../build/windows-release/test-results.xml

      - name: Upload Windows test failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-Windows-Test-Failure-Logs
          path: |
            build/windows-release/Testing/Temporary/
            build/windows-release/test-results.xml
          if-no-files-found: ignore

      - name: Assemble Files
        shell: cmd
        run: |
          call scripts\ci\windows\assemble.bat
          ren client.zip Asterbound-Windows-Client.zip
          ren server.zip Asterbound-Windows-Server.zip

      - name: Prepare Artifacts
        shell: cmd
        run: |
          cmake -E tar cf dist.zip --format=zip dist
          ren dist.zip Asterbound-Windows-All-DevOnly.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-Windows-All-DevOnly
          path: Asterbound-Windows-All-DevOnly.zip
          archive: false

      - name: Upload Client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-Windows-Client
          path: Asterbound-Windows-Client.zip
          archive: false

      - name: Upload Server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-Windows-Server
          path: Asterbound-Windows-Server.zip
          archive: false

      - name: Install Inno Setup
        shell: cmd
        run: |
          set "ISCC_PATH=%programfiles%\Inno Setup 7\ISCC.exe"
          if exist "%ISCC_PATH%" exit /b 0
          curl -fL --connect-timeout 20 --max-time 180 -o "%tmp%\innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
          if errorlevel 1 exit /b 1
          "%tmp%\innosetup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          if not exist "%ISCC_PATH%" exit /b 1

      - name: Create Installer
        shell: pwsh
        run: scripts/ci/windows/create-installer.ps1

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-Windows-Installer
          path: installer/Asterbound-Windows-Installer.exe
          archive: true
          compression-level: 0

  build_linux:
    name: Build Asterbound Linux ${{ matrix.arch }}
    needs: checks
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name != 'workflow_dispatch') || (inputs.linux == true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            preset: linux-release
            artifact: Asterbound-Linux-xclang
          - arch: arm64
            runner: ubuntu-24.04-arm
            preset: linux-arm-release
            artifact: Asterbound-Linux-ARM-xclang
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev pkgconf libxmu-dev libgl-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          '^libxcb.*-dev' libx11-xcb-dev libxrender-dev libxkbcommon-x11-dev \
          autoconf autoconf-archive automake libtool libltdl-dev patchelf tarlz

      - name: Configure and build
        uses: ./.github/actions/native-build
        with:
          preset: ${{ matrix.preset }}

      - name: Smoke test Linux executables
        run: |
          ./dist/asset_packer -version
          ./dist/asterbound_server -version
          python3 scripts/ci/smoke-client-startup.py dist/asterbound

      - name: Run Tests
        working-directory: source
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --preset "$PRESET" --output-junit "$GITHUB_WORKSPACE/build/$PRESET/test-results.xml"

      - name: Prepare Artifacts
        run: tarlz -c3vf ${{ matrix.artifact }}.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.lz
          archive: false


      - name: Assemble Files
        run: |
          scripts/ci/linux/assemble.sh
          mv -v client.tar.lz ${{ matrix.artifact }}-Client.tar.lz
          mv -v server.tar.lz ${{ matrix.artifact }}-Server.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}-Client
          path: ${{ matrix.artifact }}-Client.tar.lz
          archive: false

      - name: Upload Server Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}-Server
          path: ${{ matrix.artifact }}-Server.tar.lz
          archive: false

      - name: Upload Linux test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Test-Diagnostics-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  build_macos:
    name: Build Asterbound macOS arm64
    needs: checks
    timeout-minutes: 120
    runs-on: macos-15
    if: ${{ (github.event_name != 'pull_request') && ((github.event_name != 'workflow_dispatch') || (inputs.macOS == true)) }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: brew install autoconf autoconf-archive automake libtool tarlz

      - name: Configure and build
        uses: ./.github/actions/native-build
        with:
          preset: macos-arm-release

      - name: Copy Libraries
        run: cp lib/osx/arm64/*.dylib lib/osx/libsteam_api.dylib dist/

      - name: Smoke test client startup streams
        run: python3 scripts/ci/smoke-client-startup.py dist/asterbound

      - name: Run Tests
        working-directory: source
        run: ctest --preset macos-arm-release --output-junit ../build/macos-arm-release/test-results.xml

      - name: Prepare Artifacts
        run: tarlz -c3vf Asterbound-macOS-Silicon.tar.lz dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-macOS-Silicon
          path: Asterbound-macOS-Silicon.tar.lz
          archive: false

      - name: Assemble Files
        run: |
          scripts/ci/macos/assemble.sh
          mv -v client.tar.lz Asterbound-macOS-Silicon-Client.tar.lz

      - name: Upload Client Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Asterbound-macOS-Silicon-Client
          path: Asterbound-macOS-Silicon-Client.tar.lz
          archive: false

      - name: Upload macOS test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Test-Diagnostics-macos-arm-release
          path: |
            build/macos-arm-release/Testing/Temporary/
            build/macos-arm-release/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
