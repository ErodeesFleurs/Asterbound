name: Sanitizers

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Asset-free ASan/UBSan checks stay nightly; owned game assets are not uploaded.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  sanitized:
    name: ASan + UBSan (core_tests gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive

      - name: Install Nix
        id: nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.0/install
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true

      - name: Scope sanitizer cache
        id: keys
        env:
          INPUTS: ${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'cmake/**', 'version.json') }}
        run: echo "prefix=nix-sanitized-v1-${RUNNER_OS}-${RUNNER_ARCH}-$INPUTS" >> "$GITHUB_OUTPUT"

      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: ${{ steps.keys.outputs.prefix }}-lookup
          restore-prefixes-first-match: |
            ${{ steps.keys.outputs.prefix }}-
            nix-sanitized-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Snapshot restored Nix paths
        id: baseline
        run: python3 scripts/ci/cache-state.py nix-snapshot --output build/ci/nix-before.json

      - name: Build and run ASan + UBSan checks
        run: |
          set -o pipefail
          nix build .#sanitized --print-build-logs --out-link result-sanitized 2>&1 | tee build/ci/sanitized.log

      - name: Inspect completed Nix store paths
        id: state
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: python3 scripts/ci/cache-state.py nix-snapshot --compare build/ci/nix-before.json

      - name: Save completed Nix paths even after build failure
        if: ${{ !cancelled() && steps.state.outputs.changed == 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: ${{ steps.keys.outputs.prefix }}-${{ steps.state.outputs.inventory }}
          # A GC target, not a hard quota: rooted build closures are retained.
          gc-max-store-size-linux: 4G

      - name: Upload sanitizer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sanitizer-Diagnostics
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7
